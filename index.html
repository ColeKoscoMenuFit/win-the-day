<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Win The Day</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
      min-height: 100vh;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      padding-top: max(env(safe-area-inset-top), 16px);
    }

    .header {
      text-align: center;
      padding: 24px 0 16px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .signal-meter {
      margin: 16px 0 24px;
      padding: 20px;
      background: linear-gradient(135deg, #007aff 0%, #5856d6 100%);
      border-radius: 16px;
      color: white;
      text-align: center;
    }

    .signal-percent {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -2px;
    }

    .signal-label {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 4px;
    }

    .section {
      background: white;
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #e5e5ea;
    }

    .section-title {
      font-size: 17px;
      font-weight: 600;
    }

    .section-badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: 500;
    }

    .badge-signal {
      background: #34c759;
      color: white;
    }

    .badge-noise {
      background: #ff9500;
      color: white;
    }

    .badge-neutral {
      background: #8e8e93;
      color: white;
    }

    .tasks {
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e5ea;
    }

    .task:last-child {
      border-bottom: none;
    }

    .task input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin-right: 12px;
      accent-color: #007aff;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 16px;
    }

    .task.completed .task-text {
      text-decoration: line-through;
      color: #8e8e93;
    }

    .task-delete {
      background: none;
      border: none;
      color: #ff3b30;
      font-size: 20px;
      padding: 4px 8px;
      cursor: pointer;
      opacity: 0.7;
    }

    .add-task {
      display: flex;
      padding: 8px 16px 12px;
      gap: 8px;
    }

    .add-task input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #e5e5ea;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    .add-task input:focus {
      border-color: #007aff;
    }

    .add-task button {
      background: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }

    .focus-tags {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      flex-wrap: wrap;
    }

    .focus-tag {
      background: #e5e5ea;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      color: #1c1c1e;
    }

    .focus-tag.active {
      background: #007aff;
      color: white;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Win The Day</h1>
  </div>

  <div class="signal-meter">
    <div class="signal-percent" id="signalPercent">0%</div>
    <div class="signal-label">Signal vs Noise</div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">Today Signals</span>
      <span class="section-badge badge-signal">Signal</span>
    </div>
    <ul class="tasks" id="todaySignals"></ul>
    <div class="add-task">
      <input type="text" placeholder="Add signal..." id="addTodaySignal">
      <button onclick="addTask('todaySignals', 'addTodaySignal')">Add</button>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">Busy Work</span>
      <span class="section-badge badge-noise">Noise</span>
    </div>
    <ul class="tasks" id="busyWork"></ul>
    <div class="add-task">
      <input type="text" placeholder="Add busy work..." id="addBusyWork">
      <button onclick="addTask('busyWork', 'addBusyWork')">Add</button>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">Reminders</span>
      <span class="section-badge badge-neutral">Neutral</span>
    </div>
    <ul class="tasks" id="reminders"></ul>
    <div class="add-task">
      <input type="text" placeholder="Add reminder..." id="addReminder">
      <button onclick="addTask('reminders', 'addReminder')">Add</button>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">Tomorrow Signals</span>
      <span class="section-badge badge-signal">Signal</span>
    </div>
    <ul class="tasks" id="tomorrowSignals"></ul>
    <div class="add-task">
      <input type="text" placeholder="Plan tomorrow..." id="addTomorrowSignal">
      <button onclick="addTask('tomorrowSignals', 'addTomorrowSignal')">Add</button>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">My Focus</span>
    </div>
    <div class="focus-tags">
      <span class="focus-tag active" onclick="toggleFocus(this)">Business</span>
      <span class="focus-tag active" onclick="toggleFocus(this)">Marketing</span>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'wintheday';

    const sections = {
      todaySignals: { type: 'signal', tasks: [] },
      busyWork: { type: 'noise', tasks: [] },
      reminders: { type: 'neutral', tasks: [] },
      tomorrowSignals: { type: 'signal', tasks: [] }
    };

    function load() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        Object.keys(sections).forEach(key => {
          if (data[key]) sections[key].tasks = data[key].tasks || [];
        });
      }
      render();
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sections));
    }

    function render() {
      Object.keys(sections).forEach(key => {
        const ul = document.getElementById(key);
        ul.innerHTML = sections[key].tasks.map((task, i) => `
          <li class="task ${task.done ? 'completed' : ''}">
            <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggle('${key}', ${i})">
            <span class="task-text">${escapeHtml(task.text)}</span>
            <button class="task-delete" onclick="remove('${key}', ${i})">&times;</button>
          </li>
        `).join('');
      });
      updateSignalPercent();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function addTask(section, inputId) {
      const input = document.getElementById(inputId);
      const text = input.value.trim();
      if (!text) return;
      sections[section].tasks.push({ text, done: false });
      input.value = '';
      save();
      render();
    }

    function toggle(section, index) {
      sections[section].tasks[index].done = !sections[section].tasks[index].done;
      save();
      render();
    }

    function remove(section, index) {
      sections[section].tasks.splice(index, 1);
      save();
      render();
    }

    function updateSignalPercent() {
      let signalDone = 0, signalTotal = 0;
      let noiseDone = 0, noiseTotal = 0;

      Object.keys(sections).forEach(key => {
        const type = sections[key].type;
        sections[key].tasks.forEach(task => {
          if (type === 'signal') {
            signalTotal++;
            if (task.done) signalDone++;
          } else if (type === 'noise') {
            noiseTotal++;
            if (task.done) noiseDone++;
          }
        });
      });

      let percent = 0;
      const totalTasks = signalTotal + noiseTotal;
      if (totalTasks > 0) {
        const signalWeight = signalTotal > 0 ? (signalDone / signalTotal) * 100 : 0;
        const noiseWeight = noiseTotal > 0 ? (1 - noiseDone / noiseTotal) * 100 : 100;
        percent = Math.round((signalWeight + noiseWeight) / 2);
      }

      document.getElementById('signalPercent').textContent = percent + '%';
    }

    function toggleFocus(el) {
      el.classList.toggle('active');
    }

    // Handle enter key for inputs
    document.querySelectorAll('.add-task input').forEach(input => {
      input.addEventListener('keypress', e => {
        if (e.key === 'Enter') {
          const btn = input.nextElementSibling;
          btn.click();
        }
      });
    });

    load();
  </script>
</body>
</html>
